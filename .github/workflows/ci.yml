name: ci

on:
  pull_request:
  push:
    branches: [post-competition]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relapaw_test
          POSTGRES_USER: relapaw
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relapaw -d relapaw_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: pytest -q
      - name: PostgreSQL migration round trip
        working-directory: backend
        env:
          RELAPAW_DATABASE_URL: postgresql+psycopg://relapaw:test-only-password@127.0.0.1:5432/relapaw_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm test -- --run
          npm run build
      - name: Dependency consistency
        run: |
          pip check
          npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Container build
        run: docker build -t relapaw:ci .
