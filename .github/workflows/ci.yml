name: ci

on:
  pull_request:
  push:
    branches: [post-competition]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: relapaw_test
          POSTGRES_USER: relapaw
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relapaw -d relapaw_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.15"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: pytest -q
      - name: PostgreSQL migration round trip
        working-directory: backend
        env:
          RELAPAW_DATABASE_URL: postgresql+psycopg://relapaw:test-only-password@127.0.0.1:5432/relapaw_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base
          alembic upgrade 20261012_0008
          python -c "from sqlalchemy import create_engine,text; from app.core.config import settings; engine=create_engine(settings.database_url); connection=engine.connect(); transaction=connection.begin(); connection.execute(text(\"INSERT INTO pets (name, species) VALUES ('Legacy fixture', 'cat')\")); connection.execute(text(\"INSERT INTO owner_profiles (interaction_preference) VALUES ('synthetic fixture one'), ('synthetic fixture two')\")); transaction.commit(); connection.close()"
          alembic upgrade 20261020_0009
          python -m app.demo.assign_legacy_owner --allow-legacy-demo-data
          alembic upgrade head
          python -c "from sqlalchemy import create_engine,text; from app.core.config import settings; engine=create_engine(settings.database_url); connection=engine.connect(); assert connection.scalar(text(\"SELECT version_num FROM alembic_version\")) == '20261020_0014'; assert connection.scalar(text(\"SELECT count(*) FROM pets WHERE owner_user_id IS NULL\")) == 0; assert connection.scalar(text(\"SELECT count(*) FROM owner_profiles WHERE user_id IS NULL\")) == 0; assert connection.scalar(text(\"SELECT count(DISTINCT user_id) FROM owner_profiles\")) == 2; assert connection.scalar(text(\"SELECT count(*) FROM users WHERE status = 'DISABLED'\")) >= 2; connection.close()"
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm test -- --run
          npm run build
      - name: Dependency consistency
        run: |
          pip check
          npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Container build
        run: docker build -t relapaw:ci .
